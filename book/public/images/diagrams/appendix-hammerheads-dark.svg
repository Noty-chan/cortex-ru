<text x="516" y="310" font-size="22" class="accent">Ваша прежняя жизнь:</text>
<line x1="520" y1="345" x2="1140" y2="345" class="rule"/>
<text x="520" y="378" font-size="18" class="">Помеха: получите 1 PP, когда заменяете d8 этой</text>
<text x="520" y="403" font-size="18" class="">отличительной черты на d4.</text>
<text x="520" y="443" font-size="18" class="">Потратьте 1 PP, чтобы повысить атрибут, когда обращаетесь</text>
<text x="520" y="468" font-size="18" class="">к прежней жизни.</text>
<text x="520" y="508" font-size="18" class="">Добавьте d6 в кризисный пул, чтобы удвоить кость</text>
<text x="520" y="533" font-size="18" class="">атрибута, когда обращаетесь к прежней жизни.</text>
<rect x="500" y="610" width="660" height="310" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="516" y="640" font-size="22" class="accent">Ваш подход / настрой:</text>
<line x1="520" y1="675" x2="1140" y2="675" class="rule"/>
<text x="520" y="708" font-size="18" class="">Помеха: получите 1 PP, когда заменяете d8 этой</text>
<text x="520" y="733" font-size="18" class="">отличительной черты на d4.</text>
<text x="520" y="773" font-size="18" class="">Потратьте 1 PP, чтобы перебросить кости, когда следуете</text>
<text x="520" y="798" font-size="18" class="">своей истинной природе.</text>
<text x="520" y="838" font-size="18" class="">Добавьте d6 в кризисный пул, чтобы повысить кость пакета</text>
<text x="520" y="863" font-size="18" class="">подготовки, когда следуете своей истинной природе.</text>
<rect x="500" y="940" width="660" height="310" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="516" y="970" font-size="22" class="accent">Ваша особенность / качество:</text>
<line x1="520" y1="1005" x2="1140" y2="1005" class="rule"/>
<text x="520" y="1038" font-size="18" class="">Помеха: получите 1 PP, когда заменяете d8 этой</text>
<text x="520" y="1063" font-size="18" class="">отличительной черты на d4.</text>
<text x="520" y="1103" font-size="18" class="">Потратьте 1 PP, чтобы удвоить кость отношения, когда ваша</text>
<text x="520" y="1128" font-size="18" class="">помощь отражает вашу особенность или качество.</text>
<text x="520" y="1168" font-size="18" class="">Добавьте d6 в кризисный пул, чтобы повысить включённую в</text>
<text x="520" y="1193" font-size="18" class="">пул кость отношения, когда проявляете свою особенность</text>
<text x="520" y="1218" font-size="18" class="">или качество.</text>
