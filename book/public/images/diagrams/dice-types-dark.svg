<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 495" role="img" aria-labelledby="title desc">
<title id="title">Обозначения типов костей</title><desc id="desc">d4 — тетраэдр, d6 — гексаэдр, d8 — октаэдр, d10 — пятиугольный трапецоэдр, d12 — додекаэдр. Значки обозначают типы костей, а не результаты броска.</desc>
<rect x="0.5" y="0.5" width="639" height="494" rx="18" fill="#25232e" stroke="#494353"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="320" y="40" text-anchor="middle" font-size="28" fill="#eee9f4">Типы костей</text><polygon points="38.0,78.0 92.0,78.0 65.0,132.0" fill="#d82f70"/><text x="65" y="106" text-anchor="middle" font-size="22" fill="white">4</text><text x="115" y="112" text-anchor="start" font-size="23" fill="#eee9f4">d4</text><text x="195" y="112" text-anchor="start" font-size="22" fill="#eee9f4">Тетраэдр</text><polygon points="38.0,163.0 92.0,163.0 92.0,217.0 38.0,217.0" fill="#d82f70"/><text x="65" y="198" text-anchor="middle" font-size="22" fill="white">6</text><text x="115" y="197" text-anchor="start" font-size="23" fill="#eee9f4">d6</text><text x="195" y="197" text-anchor="start" font-size="22" fill="#eee9f4">Гексаэдр</text><polygon points="65.0,248.0 92.0,275.0 65.0,302.0 38.0,275.0" fill="#d82f70"/><text x="65" y="283" text-anchor="middle" font-size="22" fill="white">8</text><text x="115" y="282" text-anchor="start" font-size="23" fill="#eee9f4">d8</text><text x="195" y="282" text-anchor="start" font-size="22" fill="#eee9f4">Октаэдр</text><polygon points="65.0,333.0 88.4,346.5 88.4,373.5 65.0,387.0 41.6,373.5 41.6,346.5" fill="#d82f70"/><text x="65" y="368" text-anchor="middle" font-size="22" fill="white">10</text><text x="115" y="367" text-anchor="start" font-size="23" fill="#eee9f4">d10</text><text x="195" y="367" text-anchor="start" font-size="22" fill="#eee9f4">Пятиугольный трапецоэдр</text><polygon points="65.0,418.0 78.5,421.6 88.4,431.5 92.0,445.0 88.4,458.5 78.5,468.4 65.0,472.0 51.5,468.4 41.6,458.5 38.0,445.0 41.6,431.5 51.5,421.6" fill="#d82f70"/><text x="65" y="453" text-anchor="middle" font-size="22" fill="white">12</text><text x="115" y="452" text-anchor="start" font-size="23" fill="#eee9f4">d12</text><text x="195" y="452" text-anchor="start" font-size="22" fill="#eee9f4">Додекаэдр</text></g></svg>