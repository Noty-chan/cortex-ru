<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 690" role="img" aria-labelledby="title desc">
<title id="title">Пирамида навыков</title><desc id="desc">Для навыка d10 требуются два d8 и три d6. Для навыка d12 требуются два d10, три d8 и четыре d6. Верхняя кость над пунктирной линией, необходимые навыки под ней.</desc>
<rect x="0.5" y="0.5" width="659" height="689" rx="18" fill="#25232e" stroke="#494353"/>
