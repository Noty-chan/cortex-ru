nchor="middle" font-size="22" fill="white">10</text><polygon points="260.0,546.0 284.0,570.0 260.0,594.0 236.0,570.0" fill="#d82f70"/><text x="260.0" y="578" text-anchor="middle" font-size="22" fill="white">8</text><polygon points="330.0,546.0 354.0,570.0 330.0,594.0 306.0,570.0" fill="#d82f70"/><text x="330.0" y="578" text-anchor="middle" font-size="22" fill="white">8</text><polygon points="400.0,546.0 424.0,570.0 400.0,594.0 376.0,570.0" fill="#d82f70"/><text x="400.0" y="578" text-anchor="middle" font-size="22" fill="white">8</text><polygon points="201.0,611.0 249.0,611.0 249.0,659.0 201.0,659.0" fill="#d82f70"/><text x="225.0" y="643" text-anchor="middle" font-size="22" fill="white">6</text><polygon points="271.0,611.0 319.0,611.0 319.0,659.0 271.0,659.0" fill="#d82f70"/><text x="295.0" y="643" text-anchor="middle" font-size="22" fill="white">6</text><polygon points="341.0,611.0 389.0,611.0 389.0,659.0 341.0,659.0" fill="#d82f70"/><text x="365.0" y="643" text-anchor="middle" font-size="22" fill="white">6</text><polygon points="411.0,611.0 459.0,611.0 459.0,659.0 411.0,659.0" fill="#d82f70"/><text x="435.0" y="643" text-anchor="middle" font-size="22" fill="white">6</text><path d="M 210 472 H 450" stroke="#eee9f4" stroke-width="2" stroke-dasharray="7 6"/></g></svg>