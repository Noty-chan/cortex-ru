<text x="40" y="160" font-size="20" class="">Впишите название кризисного пула в каждый сектор. Над значками подходящих костей запишите число костей</text>
<text x="40" y="187" font-size="20" class="">его начальной оценки. Положите кости каждого кризисного пула в большую пустую область.</text>
