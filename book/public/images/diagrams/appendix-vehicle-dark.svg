<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img"><title>HAMMERHEADS — лист транспорта</title><desc>Источник: с.247 / PDF251, верхняя половина.</desc><style>text{font-family:Arial,sans-serif;fill:#edf0f7}.muted{fill:#abb7cd}.accent{fill:#f399bd}.rule{stroke:#69758d;stroke-width:1.5}</style><rect width="1200" height="1100" rx="20" fill="#191c25"/>
<text x="40" y="60" font-size="34" class="accent">HAMMERHEADS — лист транспорта</text>
<text x="40" y="96" font-size="17" class="muted">Источник: с.247 / PDF251, верхняя половина.</text>
<line x1="40" y1="116" x2="1160" y2="116" class="rule"/>
<rect x="40" y="150" width="390" height="630" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="56" y="180" font-size="16.528162511542014" class="accent">Атрибуты: Двигатели / Корпус / Системы</text>
<text x="60" y="230" font-size="23" class="">○ Hammerhead One</text>
<text x="60" y="275" font-size="23" class="">d8 / d8 / d10</text>
<text x="60" y="315" font-size="18" class="">Манёвреннее; более точные</text>
<text x="60" y="340" font-size="18" class="">датчики и приборы.</text>
<text x="60" y="410" font-size="23" class="">○ Hammerhead Two</text>
<text x="60" y="455" font-size="23" class="">d10 / d8 / d8</text>
<text x="60" y="495" font-size="18" class="">Быстрее; больше мощность и</text>
<text x="60" y="520" font-size="18" class="">дальность.</text>
<text x="60" y="590" font-size="23" class="">○ Hammerhead Three</text>
<text x="60" y="635" font-size="23" class="">d8 / d10 / d8</text>
<text x="60" y="675" font-size="18" class="">Крупнее, прочнее и выносливее.</text>
<rect x="460" y="150" width="700" height="295" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="476" y="180" font-size="22" class="accent">Отличительные черты — все d8</text>
<text x="480" y="220" font-size="23" class="">Транспорт ресурсной поддержки</text>
<text x="480" y="269" font-size="23" class="">По последнему слову техники</text>
<text x="480" y="318" font-size="23" class="">Датчики широкого спектра</text>
<text x="480" y="385" font-size="18" class="">Помеха: получите 1 PP, когда заменяете d8 этой отличительной</text>
<text x="480" y="410" font-size="18" class="">черты на d4.</text>
<rect x="460" y="470" width="700" height="130" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="476" y="500" font-size="22" class="accent">Нераспределённые ресурсы</text>
<text x="480" y="550" font-size="27" class="">d6    d6    d6    d6    d6    d6    d6</text>
<rect x="460" y="620" width="700" height="380" rx="10" fill="#252a37" stroke="#535f75"/>
<text x="476" y="650" font-size="22" class="accent">Пулы ресурсов</text>
<text x="480" y="690" font-size="20" class="">Тактическая поддержка</text>
<text x="480" y="714" font-size="17" class="muted">База: d6     □ d6     □ d6     □ d6</text>
<text x="480" y="747" font-size="20" class="">Медицинские запасы</text>
<text x="480" y="771" font-size="17" class="muted">База: d6     □ d6     □ d6     □ d6</text>
<text x="480" y="804" font-size="20" class="">IT и сети</text>
<text x="480" y="828" font-size="17" class="muted">База: d6     □ d6     □ d6     □ d6</text>
<text x="480" y="861" font-size="20" class="">Пища и укрытие</text>
<text x="480" y="885" font-size="17" class="muted">База: d6     □ d6     □ d6     □ d6</text>
<text x="480" y="918" font-size="20" class="">Поддержка на суше, воде и в воздухе</text>
<text x="480" y="942" font-size="17" class="muted">База: d6     □ d6     □ d6     □ d6</text>
<text x="40" y="1075" font-size="15" class="muted">Русское воспроизведение • Cortex Prime Game Handbook, 2020 • функциональная разметка сохранена</text>
</svg>