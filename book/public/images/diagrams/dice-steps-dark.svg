<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 335" role="img" aria-labelledby="title desc">
<title id="title">Повышение и понижение костей</title><desc id="desc">d4 становится d6 при повышении на одну ступень; d8 становится d12 при повышении на две; d12 становится d10 при понижении на одну.</desc>
<rect x="0.5" y="0.5" width="659" height="334" rx="18" fill="#25232e" stroke="#494353"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="330" y="40" text-anchor="middle" font-size="27" fill="#eee9f4">Изменение размера кости</text><polygon points="48.0,73.0 102.0,73.0 75.0,127.0" fill="#d82f70"/><text x="75" y="101" text-anchor="middle" font-size="22" fill="white">4</text><path d="M 125 100 H 200 l -10 -7 m 10 7 l -10 7" fill="none" stroke="#eee9f4" stroke-width="3"/><polygon points="223.0,73.0 277.0,73.0 277.0,127.0 223.0,127.0" fill="#d82f70"/><text x="250" y="108" text-anchor="middle" font-size="22" fill="white">6</text><text x="320" y="108" text-anchor="start" font-size="24" fill="#eee9f4">Повысить на 1</text><polygon points="75.0,163.0 102.0,190.0 75.0,217.0 48.0,190.0" fill="#d82f70"/><text x="75" y="198" text-anchor="middle" font-size="22" fill="white">8</text><path d="M 125 190 H 200 l -10 -7 m 10 7 l -10 7" fill="none" stroke="#eee9f4" stroke-width="3"/><polygon points="250.0,163.0 263.5,166.6 273.4,176.5 277.0,190.0 273.4,203.5 263.5,213.4 250.0,217.0 236.5,213.4 226.6,203.5 223.0,190.0 226.6,176.5 236.5,166.6" fill="#d82f70"/><text x="250" y="198" text-anchor="middle" font-size="22" fill="white">12</text><text x="320" y="198" text-anchor="start" font-size="24" fill="#eee9f4">Повысить на 2</text><polygon points="75.0,253.0 88.5,256.6 98.4,266.5 102.0,280.0 98.4,293.5 88.5,303.4 75.0,307.0 61.5,303.4 51.6,293.5 48.0,280.0 51.6,266.5 61.5,256.6" fill="#d82f70"/><text x="75" y="288" text-anchor="middle" font-size="22" fill="white">12</text><path d="M 125 280 H 200 l -10 -7 m 10 7 l -10 7" fill="none" stroke="#eee9f4" stroke-width="3"/><polygon points="250.0,253.0 273.4,266.5 273.4,293.5 250.0,307.0 226.6,293.5 226.6,266.5" fill="#d82f70"/><text x="250" y="288" text-anchor="middle" font-size="22" fill="white">10</text><text x="320" y="288" text-anchor="start" font-size="24" fill="#eee9f4">Понизить на 1</text></g></svg>